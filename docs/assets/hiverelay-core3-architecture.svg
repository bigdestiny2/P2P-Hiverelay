  <text class="node-text" x="1312" y="608">manifest, catalog, capability doc</text>
  <text class="node-text" x="1312" y="626">anchor proof, usage receipt</text>
  <text class="node-text" x="1312" y="644">release evidence sidecars</text>

  <rect class="panel" x="36" y="796" width="744" height="230" rx="18"/>
  <text class="section-title" x="58" y="829">SECURITY BOUNDARIES</text>

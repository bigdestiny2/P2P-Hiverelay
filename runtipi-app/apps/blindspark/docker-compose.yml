services:
  blindspark:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:0.26.0-rc.8@sha256:77cd3c3453d868086cd89c1ece3de13aa60520b419eca620cc143a7799e9f2c5
    command:
      - start
      - --storage
      - /data
      - --port
      - "9100"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/storage-generation:/config:ro
    environment:
      - HOME=/data
      - HIVERELAY_API_KEY=${HIVERELAY_API_KEY}
      - HIVERELAY_ACCEPT_MODE=review
      - HIVERELAY_MAX_STORAGE=10GB
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_REQUIRE_GENERATION_RECEIPT=1
      - HIVERELAY_GENERATION_RECEIPT=/config/storage-generation-receipt.v1.json
      - HIVERELAY_GENERATION_RECEIPT_SHA256_FILE=/config/storage-generation-receipt.v1.sha256
      - HIVERELAY_UI_SIMPLE=true
      - HIVERELAY_UI_EXPOSE_TOKEN=true
    x-runtipi:
      internal_port: 9100
      is_main: true

x-runtipi:
  schema_version: 2

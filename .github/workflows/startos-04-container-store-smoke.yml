name: StartOS 0.4 container store smoke

# Exercise the exact multi-platform image operation that blocked RC6 and run a
# real Start CLI 1.1.0 universal pack without release credentials or release
# mutation. The immutable RC7 image is a public build fixture; manifest version
# and gitHash expectations come from the checked-out PR source.
on:
  pull_request:
    paths:
      - '.github/workflows/release-startos-0.4.yml'
      - '.github/workflows/startos-04-container-store-smoke.yml'
      - 'package.json'
      - 'scripts/audit-workspace-alignment.mjs'
      - 'scripts/install-startos-cli.sh'
      - 'scripts/lib/release-evidence-contract.mjs'
      - 'scripts/lib/startos-04-release-evidence.mjs'
      - 'scripts/verify-startos-04-package-manifest.mjs'
      - 'startos-0.4/**'
      - 'test/unit/release-startos-04-workflow.test.js'
      - 'test/unit/startos-04-container-store-smoke-workflow.test.js'
      - 'test/unit/startos-04-release-evidence.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startos-04-container-store-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  multi-platform-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HIVERELAY_IMAGE_NAME: ghcr.io/bigdestiny2/p2p-hiverelay
      HIVERELAY_RELEASE_TAG: v0.26.0-rc.7
      HIVERELAY_IMAGE_DIGEST: sha256:1238939f290715aa1da20629d4f1c07e73f30f1b96a518f337a3c45e729177a8
      HIVERELAY_STARTOS_04_IMAGE_REF: ghcr.io/bigdestiny2/p2p-hiverelay:0.26.0-rc.7@sha256:1238939f290715aa1da20629d4f1c07e73f30f1b96a518f337a3c45e729177a8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve checked-out source identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD)"
          if ! [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || [ "$source_sha" != "$GITHUB_SHA" ]; then
            echo "Checked-out source SHA is not the exact workflow SHA: head=$source_sha workflow=$GITHUB_SHA" >&2
            exit 1
          fi
          root_version="$(node -p "require('./package.json').version")"
          package_version="$(node -e "const fs=require('node:fs');const source=fs.readFileSync('startos-0.4/startos/versions/current.ts','utf8');const match=/version:\\s*'([^']+)'/.exec(source);if(!match)process.exit(1);process.stdout.write(match[1])")"
          package_semver="${package_version%%:*}"
          package_build="${package_version##*:}"
          source_tag="v$package_semver"
          if [ "$package_semver" = "$package_version" ] || ! [[ "$package_build" =~ ^[0-9]+$ ]]; then
            echo "StartOS authored package version is malformed: $package_version" >&2
            exit 1
          fi
          if [ "$package_semver" != "$root_version" ] || ! [[ "$source_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "StartOS authored package version $package_version is not aligned with root version $root_version." >&2
            exit 1
          fi
          {
            echo "HIVERELAY_SMOKE_SOURCE_TAG=$source_tag"
            echo "HIVERELAY_SMOKE_SOURCE_SHA=$source_sha"
            echo "HIVERELAY_STARTOS_04_PACKAGE_VERSION=$package_version"
          } >> "$GITHUB_ENV"

      - name: Enable Docker containerd image store
        run: |
          set -euo pipefail
          current="$(mktemp "$RUNNER_TEMP/docker-daemon-current.XXXXXX")"
          next="$(mktemp "$RUNNER_TEMP/docker-daemon-containerd.XXXXXX")"
          trap 'rm -f "$current" "$next"' EXIT
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$current"
          else
            printf '{}\n' > "$current"
          fi
          jq -e 'type == "object"' "$current" >/dev/null
          jq '.features = (.features // {}) | .features["containerd-snapshotter"] = true' \
            "$current" > "$next"
          sudo install -o root -g root -m 0644 "$next" /etc/docker/daemon.json
          sudo systemctl restart docker.service
          ready=0
          for attempt in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'Docker did not become ready after enabling the containerd image store.' >&2
            exit 1
          fi
          driver_status="$(docker info --format '{{json .DriverStatus}}')"
          printf '%s\n' "$driver_status"
          printf '%s\n' "$driver_status" | jq -e \
            'any(.[]; .[0] == "driver-type" and .[1] == "io.containerd.snapshotter.v1")' >/dev/null

      - name: Confirm universal-pack disk budget
        run: |
          set -euo pipefail
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          for disk_path in "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$docker_root"; do
            available_kib="$(df -Pk "$disk_path" | awk 'NR == 2 { print $4 }')"
            if ! [[ "$available_kib" =~ ^[0-9]+$ ]] || [ "$available_kib" -lt 8388608 ]; then
              echo "Universal StartOS pack requires at least 8 GiB free at $disk_path; found ${available_kib:-unknown} KiB." >&2
              exit 1
            fi
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$docker_root"

      - name: Verify immutable image resolves for both StartOS architectures
        run: |
          set -euo pipefail
          expected_ref="$HIVERELAY_IMAGE_NAME:${HIVERELAY_RELEASE_TAG#v}@$HIVERELAY_IMAGE_DIGEST"
          if [ "$HIVERELAY_STARTOS_04_IMAGE_REF" != "$expected_ref" ]; then
            echo 'StartOS image ref drifted from the authenticated release digest.' >&2
            exit 1
          fi
          container=''
          trap 'if [ -n "$container" ]; then docker rm -f "$container" >/dev/null 2>&1 || true; fi' EXIT
          for platform in linux/arm64 linux/amd64; do
            container="$(docker create "--platform=$platform" "$HIVERELAY_STARTOS_04_IMAGE_REF")"
            if ! [[ "$container" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Docker returned a malformed container id for $platform." >&2
              exit 1
            fi
            docker rm "$container" >/dev/null
            container=''
          done

      - name: Install pinned StartOS filesystem tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            squashfs-tools-ng=1.2.0-1 \
            squashfs-tools=1:4.6.1-1build1
          [ "$(dpkg-query -W -f='${Version}' squashfs-tools-ng)" = '1.2.0-1' ]
          [ "$(dpkg-query -W -f='${Version}' squashfs-tools)" = '1:4.6.1-1build1' ]
          dpkg --verify squashfs-tools-ng squashfs-tools
          [ "$(command -v tar2sqfs)" = /usr/bin/tar2sqfs ]
          [ "$(command -v mksquashfs)" = /usr/bin/mksquashfs ]
          [ "$(command -v unsquashfs)" = /usr/bin/unsquashfs ]

      - name: Install authenticated StartOS CLI
        run: bash scripts/install-startos-cli.sh "$RUNNER_TEMP/startos-cli-1.1.0" "$GITHUB_PATH"

      - name: Install locked StartOS dependencies
        working-directory: startos-0.4
        run: npm ci

      - name: Build and verify fixture-bound authoring manifest
        working-directory: startos-0.4
        run: |
          set -euo pipefail
          if [ -e blindspark.s9pk ]; then
            echo 'Unexpected pre-existing StartOS package output before the smoke build.' >&2
            exit 1
          fi
          make check-release-image ingredients \
            REQUIRE_RELEASE_IMAGE_DIGEST=1 \
            IMAGE_TAG="$HIVERELAY_IMAGE_NAME:${HIVERELAY_RELEASE_TAG#v}" \
            IMAGE_DIGEST="$HIVERELAY_IMAGE_DIGEST"
          if [ ! -f javascript/index.js ] || [ -L javascript/index.js ] || [ ! -s javascript/index.js ]; then
            echo 'StartOS built javascript bundle is missing, empty, or not a regular file.' >&2
            exit 1
          fi
          javascript_sha="$(sha256sum javascript/index.js | cut -d ' ' -f 1)"
          if ! [[ "$javascript_sha" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'StartOS built javascript bundle SHA-256 is malformed.' >&2
            exit 1
          fi
          authoring_manifest_file="$RUNNER_TEMP/startos-0.4-smoke-authoring-manifest.json"
          node -e "console.log(JSON.stringify(require('./javascript/index.js').manifest))" > "$authoring_manifest_file"
          node ../scripts/verify-startos-04-package-manifest.mjs \
            --manifest-kind authoring \
            --tag "$HIVERELAY_SMOKE_SOURCE_TAG" \
            --release-sha "$HIVERELAY_SMOKE_SOURCE_SHA" \
            --package-version "$HIVERELAY_STARTOS_04_PACKAGE_VERSION" \
            --image-ref "$HIVERELAY_STARTOS_04_IMAGE_REF" < "$authoring_manifest_file"
          echo "HIVERELAY_STARTOS_04_JAVASCRIPT_SHA256=$javascript_sha" >> "$GITHUB_ENV"

      - name: Generate ephemeral StartOS developer key
        working-directory: startos-0.4
        run: |
          set -euo pipefail
          key_path="$HOME/.startos/id.key.pem"
          workspace_key="../.startos/build.key.pem"
          if [ -e "$key_path" ] || [ -e "$workspace_key" ]; then
            echo 'Refusing to reuse a pre-existing StartOS developer key in the credential-free smoke.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.startos"
          start-cli init-key
          if [ ! -f "$key_path" ] || [ -L "$key_path" ] || [ ! -s "$key_path" ]; then
            echo 'Ephemeral StartOS developer key is missing, empty, or not a regular file.' >&2
            exit 1
          fi
          mkdir -p ../.startos
          install -m 0600 "$key_path" "$workspace_key"
          [ "$(stat -c '%a' "$workspace_key")" = 600 ]

      - name: Pack the preverified universal package
        working-directory: startos-0.4
        run: |
          set -euo pipefail
          if ! [[ "$HIVERELAY_STARTOS_04_JAVASCRIPT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Verified StartOS javascript bundle SHA-256 is missing or malformed.' >&2
            exit 1
          fi
          before_sha="$(sha256sum javascript/index.js | cut -d ' ' -f 1)"
          if [ "$before_sha" != "$HIVERELAY_STARTOS_04_JAVASCRIPT_SHA256" ]; then
            echo 'StartOS javascript bundle changed after authoring-manifest verification.' >&2
            exit 1
          fi
          start-cli s9pk pack -o blindspark.s9pk
          after_sha="$(sha256sum javascript/index.js | cut -d ' ' -f 1)"
          if [ "$after_sha" != "$HIVERELAY_STARTOS_04_JAVASCRIPT_SHA256" ]; then
            echo 'StartOS javascript bundle changed while assembling the package.' >&2
            exit 1
          fi
          if [ ! -f blindspark.s9pk ] || [ -L blindspark.s9pk ] || [ ! -s blindspark.s9pk ]; then
            echo 'StartOS 0.4 universal package is missing, empty, or not a regular file.' >&2
            exit 1
          fi

      - name: Inspect and verify packed manifest
        working-directory: startos-0.4
        run: |
          set -euo pipefail
          packed_manifest_file="$RUNNER_TEMP/startos-0.4-smoke-packed-manifest.json"
          start-cli s9pk inspect blindspark.s9pk manifest --format json > "$packed_manifest_file"
          node ../scripts/verify-startos-04-package-manifest.mjs \
            --manifest-kind packed \
            --tag "$HIVERELAY_SMOKE_SOURCE_TAG" \
            --release-sha "$HIVERELAY_SMOKE_SOURCE_SHA" \
            --package-version "$HIVERELAY_STARTOS_04_PACKAGE_VERSION" < "$packed_manifest_file"

      - name: Confirm no release mutation
        run: printf '%s\n' 'Universal-pack smoke completed with an ephemeral key and without release credentials, uploads, or publication.'

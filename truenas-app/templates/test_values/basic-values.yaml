TZ: Etc/UTC

resources:
  limits:
    cpus: 2.0
    memory: 2048

blindspark:
  api_key: test-only-hiverelay-management-key
  accept_mode: review
  max_storage_gb: 10
  log_level: info
  simple_dashboard: true
  expose_token: false
  holesail: false
  additional_envs: []

network:
  host_network: false
  networks: []
  web_port:
    bind_mode: published
    port_number: 30452
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/blindspark/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true

labels: []

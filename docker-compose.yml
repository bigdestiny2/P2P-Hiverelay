# p2p-hiverelay — Docker Compose orchestration
#
# Quick start:
#   docker compose up -d          # relay + tor + all utility services
#   docker compose logs -f relay  # tail logs
#   docker compose exec relay p2p-hiverelay tui   # open management TUI
#   docker compose down           # stop (data persists in the named volume)
#
# Multi-region mesh:
#   docker compose --profile mesh up -d
#   (runs 3 relays — NA, EU, AS — that discover each other via DHT, each with its own tor sidecar)
#
# Home-relay mode (behind NAT, no port forwarding needed):
#   HIVERELAY_HOLESAIL=1 docker compose up -d
#
# Tor is enabled by default. To run without tor:
#   HIVERELAY_TOR=0 docker compose up --no-deps -d relay
#
# Switch to host networking for maximal DHT reachability (Linux only):
#   uncomment the `network_mode: host` line below and comment out `ports:`

name: hiverelay

services:
  relay:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay
    restart: unless-stopped
    volumes:
      - hiverelay-data:/data       # Hypercore storage, seeded content
      - hiverelay-config:/config   # ~/.hiverelay → persistent config + identity
    ports:
      - "${HIVERELAY_PORT:-9100}:9100"   # management API + dashboard
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=${HIVERELAY_LOG_LEVEL:-info}
      - HIVERELAY_REGION=${HIVERELAY_REGION:-NA}
      - HIVERELAY_MAX_STORAGE=${HIVERELAY_MAX_STORAGE:-50GB}
      - HIVERELAY_API_KEY=${HIVERELAY_API_KEY:-}
      # Uncomment to enable Holesail transport for home relays behind NAT
      # - HIVERELAY_HOLESAIL=1
      #
      # ─── Tor (enabled by default) ────────────────────────────────
      # The tor sidecar below provides SOCKS5 + control port.
      # The relay creates a persistent v3 onion service via ADD_ONION.
      # Set HIVERELAY_TOR=0 to disable.
      - HIVERELAY_TOR=${HIVERELAY_TOR:-1}
      - HIVERELAY_TOR_SOCKS_HOST=hiverelay-tor
      - HIVERELAY_TOR_SOCKS_PORT=9050
      - HIVERELAY_TOR_CONTROL_HOST=hiverelay-tor
      - HIVERELAY_TOR_CONTROL_PORT=9051
      - HIVERELAY_TOR_KEY_FILE=/config/tor-onion-key.blob
      - HIVERELAY_TOR_MIN_DAEMON_VERSION=0.4.9.5
      # Optional restricted-discovery roster (one base32 x25519 pubkey/line):
      # - HIVERELAY_TOR_ROSTER_FILE=/config/tor-client-auth-roster.txt
      #
      # ─── Utility services (enabled by default) ───────────────────
      # These make the relay useful to all apps on the substrate:
      # outboxlog = signed append-only outboxes (every app uses this)
      # notify    = encrypted wake-up push (APNs/FCM/WebPush)
      # shard-store = k-of-n blind custody for BlindShard
      # storage-proof = prove a relay holds bytes (challenge-response)
      # vrf       = verifiable randomness (public, checkable)
      # witnesslog = signed availability notes
      # repairticket = self-healing work orders
      - HIVERELAY_ENABLE_SERVICES=1
      - HIVERELAY_OUTBOXLOG=1
      - HIVERELAY_OUTBOXLOG_JOURNAL=hypercore-outboxes
      - HIVERELAY_OUTBOXLOG_MAX_JOURNAL_STORAGE=512MB
      - HIVERELAY_NOTIFY=1
      # Real APNs/FCM/WebPush egress requires a private JSON descriptor:
      # - HIVERELAY_NOTIFY_PUSH_CONFIG=/config/notify-push.json
      # Shard custody is deliberately opt-in because it consumes operator disk:
      # - HIVERELAY_SHARD_STORE=1
      - HIVERELAY_STORAGE_PROOF=1
      - HIVERELAY_VRF=1
      - HIVERELAY_WITNESSLOG=1
      - HIVERELAY_REPAIRTICKET=1
    command: >
      start
      --storage /data
      --region ${HIVERELAY_REGION:-NA}
      --max-storage ${HIVERELAY_MAX_STORAGE:-50GB}
    depends_on:
      tor:
        condition: service_healthy
    # Linux hosts only — gives direct UDP/DHT reachability.
    # network_mode: host

  # ─── Tor sidecar (default companion) ────────────────────────────────
  # Provides a v3 onion service so peers can reach the relay without
  # knowing its real IP. PoW defense (prop 327) + vanguards-lite enabled.
  # Pin: tor 0.4.9.x (0.4.8 hard-sunset 2026-09-01).
  tor:
    image: djschilling/tor:0.4.9
    container_name: hiverelay-tor
    restart: unless-stopped
    volumes:
      - hiverelay-tor-data:/var/lib/tor
      - ./deploy/tor/torrc:/etc/tor/torrc:ro
    environment:
      - TOR_LOG=notice
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /var/lib/tor/control_auth_cookie"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ─── Multi-region mesh profile ──────────────────────────────────────
  # Spin up three relays in NA / EU / AS that discover each other via DHT.
  # Each relay gets its own tor sidecar.
  # Run with:  docker compose --profile mesh up -d

  relay-na:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay-na
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-na-data:/data
      - hiverelay-na-config:/config
    ports:
      - "9100:9100"
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_TOR=1
      - HIVERELAY_TOR_SOCKS_HOST=hiverelay-na-tor
      - HIVERELAY_TOR_CONTROL_HOST=hiverelay-na-tor
      - HIVERELAY_TOR_MIN_DAEMON_VERSION=0.4.9.5
      - HIVERELAY_ENABLE_SERVICES=1
      - HIVERELAY_OUTBOXLOG=1
      - HIVERELAY_OUTBOXLOG_JOURNAL=hypercore-outboxes
      - HIVERELAY_OUTBOXLOG_MAX_JOURNAL_STORAGE=512MB
      - HIVERELAY_NOTIFY=1
      - HIVERELAY_STORAGE_PROOF=1
      - HIVERELAY_VRF=1
      - HIVERELAY_WITNESSLOG=1
    depends_on:
      relay-na-tor:
        condition: service_healthy
    command: ["start", "--storage", "/data", "--region", "NA", "--max-storage", "50GB"]

  relay-na-tor:
    image: djschilling/tor:0.4.9
    container_name: hiverelay-na-tor
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-na-tor-data:/var/lib/tor
      - ./deploy/tor/torrc:/etc/tor/torrc:ro
    environment:
      - TOR_LOG=notice
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /var/lib/tor/control_auth_cookie"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  relay-eu:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay-eu
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-eu-data:/data
      - hiverelay-eu-config:/config
    ports:
      - "9101:9100"
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_TOR=1
      - HIVERELAY_TOR_SOCKS_HOST=hiverelay-eu-tor
      - HIVERELAY_TOR_CONTROL_HOST=hiverelay-eu-tor
      - HIVERELAY_TOR_MIN_DAEMON_VERSION=0.4.9.5
      - HIVERELAY_ENABLE_SERVICES=1
      - HIVERELAY_OUTBOXLOG=1
      - HIVERELAY_OUTBOXLOG_JOURNAL=hypercore-outboxes
      - HIVERELAY_OUTBOXLOG_MAX_JOURNAL_STORAGE=512MB
      - HIVERELAY_NOTIFY=1
      - HIVERELAY_STORAGE_PROOF=1
      - HIVERELAY_VRF=1
      - HIVERELAY_WITNESSLOG=1
    depends_on:
      relay-eu-tor:
        condition: service_healthy
    command: ["start", "--storage", "/data", "--region", "EU", "--max-storage", "50GB"]

  relay-eu-tor:
    image: djschilling/tor:0.4.9
    container_name: hiverelay-eu-tor
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-eu-tor-data:/var/lib/tor
      - ./deploy/tor/torrc:/etc/tor/torrc:ro
    environment:
      - TOR_LOG=notice
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /var/lib/tor/control_auth_cookie"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  relay-as:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay-as
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-as-data:/data
      - hiverelay-as-config:/config
    ports:
      - "9102:9100"
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_TOR=1
      - HIVERELAY_TOR_SOCKS_HOST=hiverelay-as-tor
      - HIVERELAY_TOR_CONTROL_HOST=hiverelay-as-tor
      - HIVERELAY_TOR_MIN_DAEMON_VERSION=0.4.9.5
      - HIVERELAY_ENABLE_SERVICES=1
      - HIVERELAY_OUTBOXLOG=1
      - HIVERELAY_OUTBOXLOG_JOURNAL=hypercore-outboxes
      - HIVERELAY_OUTBOXLOG_MAX_JOURNAL_STORAGE=512MB
      - HIVERELAY_NOTIFY=1
      - HIVERELAY_STORAGE_PROOF=1
      - HIVERELAY_VRF=1
      - HIVERELAY_WITNESSLOG=1
    depends_on:
      relay-as-tor:
        condition: service_healthy
    command: ["start", "--storage", "/data", "--region", "AS", "--max-storage", "50GB"]

  relay-as-tor:
    image: djschilling/tor:0.4.9
    container_name: hiverelay-as-tor
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-as-tor-data:/var/lib/tor
      - ./deploy/tor/torrc:/etc/tor/torrc:ro
    environment:
      - TOR_LOG=notice
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /var/lib/tor/control_auth_cookie"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  hiverelay-data:
  hiverelay-config:
  hiverelay-tor-data:
  hiverelay-na-data:
  hiverelay-na-config:
  hiverelay-na-tor-data:
  hiverelay-eu-data:
  hiverelay-eu-config:
  hiverelay-eu-tor-data:
  hiverelay-as-data:
  hiverelay-as-config:
  hiverelay-as-tor-data:

# p2p-hiverelay — Docker Compose orchestration
#
# Quick start:
#   docker compose up -d          # bounded relay (services stay opt-in)
#   docker compose logs -f relay  # tail logs
#   docker compose exec relay p2p-hiverelay tui   # open management TUI
#   docker compose down           # stop (data persists in the named volume)
#
# Multi-region mesh:
#   docker compose --profile mesh up -d
#   (runs 3 relays — NA, EU, AS — that discover each other via DHT)
#
# Home-relay mode (behind NAT, no port forwarding needed):
#   HIVERELAY_HOLESAIL=1 docker compose up -d
#
# Switch to host networking for maximal DHT reachability (Linux only):
#   uncomment the `network_mode: host` line below and comment out `ports:`

name: hiverelay

services:
  relay:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay
    restart: unless-stopped
    volumes:
      - hiverelay-data:/data       # Hypercore storage, seeded content
      # Offline ceremony output: exact receipt + separate sha256 pin file.
      # Runtime receives it read-only and refuses startup when either is absent.
      - ./storage-generation:/config:ro
    ports:
      - "${HIVERELAY_PORT:-9100}:9100"   # management API + dashboard
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=${HIVERELAY_LOG_LEVEL:-info}
      - HIVERELAY_REGION=${HIVERELAY_REGION:-NA}
      - HIVERELAY_MAX_STORAGE=${HIVERELAY_MAX_STORAGE:-50GB}
      # Optional planning label; leaving it empty is safer than guessing the
      # host's hardware role. Example: seeder-standard.
      - HIVERELAY_CAPACITY_PROFILE=${HIVERELAY_CAPACITY_PROFILE:-}
      - HIVERELAY_API_KEY=${HIVERELAY_API_KEY:-}
      - HIVERELAY_REQUIRE_GENERATION_RECEIPT=1
      - HIVERELAY_GENERATION_RECEIPT=/config/storage-generation-receipt.v1.json
      - HIVERELAY_GENERATION_RECEIPT_SHA256_FILE=/config/storage-generation-receipt.v1.sha256
      # Uncomment to enable Holesail transport for home relays behind NAT
      # - HIVERELAY_HOLESAIL=1
      #
      # ─── Utility services (explicit opt-in) ──────────────────────
      # A general relay must not silently become a multi-service storage
      # host. Enable reviewed providers from the Services dashboard, which
      # persists the authoritative plugins list in /data/services.json.
      # These zero defaults also make a future env-wiring change fail safe.
      - HIVERELAY_ENABLE_SERVICES=${HIVERELAY_ENABLE_SERVICES:-0}
      - HIVERELAY_OUTBOXLOG=${HIVERELAY_OUTBOXLOG:-0}
      - HIVERELAY_NOTIFY=${HIVERELAY_NOTIFY:-0}
      - HIVERELAY_SHARD_STORE=${HIVERELAY_SHARD_STORE:-0}
      - HIVERELAY_STORAGE_PROOF=${HIVERELAY_STORAGE_PROOF:-0}
      - HIVERELAY_VRF=${HIVERELAY_VRF:-0}
      - HIVERELAY_WITNESSLOG=${HIVERELAY_WITNESSLOG:-0}
      - HIVERELAY_REPAIRTICKET=${HIVERELAY_REPAIRTICKET:-0}
    command: >
      start
      --storage /data
      --region ${HIVERELAY_REGION:-NA}
      --max-storage ${HIVERELAY_MAX_STORAGE:-50GB}
    # Linux hosts only — gives direct UDP/DHT reachability.
    # network_mode: host

  # ─── Multi-region mesh profile ──────────────────────────────────────
  # Spin up three relays in NA / EU / AS that discover each other via DHT.
  # Run with:  docker compose --profile mesh up -d

  relay-na:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay-na
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-na-data:/data
      - ./storage-generation/na:/config:ro
    ports:
      - "9100:9100"
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_REQUIRE_GENERATION_RECEIPT=1
      - HIVERELAY_GENERATION_RECEIPT=/config/storage-generation-receipt.v1.json
      - HIVERELAY_GENERATION_RECEIPT_SHA256_FILE=/config/storage-generation-receipt.v1.sha256
      - HIVERELAY_ENABLE_SERVICES=0
      - HIVERELAY_OUTBOXLOG=0
      - HIVERELAY_NOTIFY=0
      - HIVERELAY_SHARD_STORE=0
      - HIVERELAY_STORAGE_PROOF=0
      - HIVERELAY_VRF=0
      - HIVERELAY_WITNESSLOG=0
    command: ["start", "--storage", "/data", "--region", "NA", "--max-storage", "50GB"]

  relay-eu:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay-eu
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-eu-data:/data
      - ./storage-generation/eu:/config:ro
    ports:
      - "9101:9100"
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_REQUIRE_GENERATION_RECEIPT=1
      - HIVERELAY_GENERATION_RECEIPT=/config/storage-generation-receipt.v1.json
      - HIVERELAY_GENERATION_RECEIPT_SHA256_FILE=/config/storage-generation-receipt.v1.sha256
      - HIVERELAY_ENABLE_SERVICES=0
      - HIVERELAY_OUTBOXLOG=0
      - HIVERELAY_NOTIFY=0
      - HIVERELAY_SHARD_STORE=0
      - HIVERELAY_STORAGE_PROOF=0
      - HIVERELAY_VRF=0
      - HIVERELAY_WITNESSLOG=0
    command: ["start", "--storage", "/data", "--region", "EU", "--max-storage", "50GB"]

  relay-as:
    image: ghcr.io/bigdestiny2/p2p-hiverelay:latest
    build: .
    container_name: hiverelay-as
    profiles: ["mesh"]
    restart: unless-stopped
    volumes:
      - hiverelay-as-data:/data
      - ./storage-generation/as:/config:ro
    ports:
      - "9102:9100"
    environment:
      - NODE_ENV=production
      - HIVERELAY_LOG_LEVEL=info
      - HIVERELAY_REQUIRE_GENERATION_RECEIPT=1
      - HIVERELAY_GENERATION_RECEIPT=/config/storage-generation-receipt.v1.json
      - HIVERELAY_GENERATION_RECEIPT_SHA256_FILE=/config/storage-generation-receipt.v1.sha256
      - HIVERELAY_ENABLE_SERVICES=0
      - HIVERELAY_OUTBOXLOG=0
      - HIVERELAY_NOTIFY=0
      - HIVERELAY_SHARD_STORE=0
      - HIVERELAY_STORAGE_PROOF=0
      - HIVERELAY_VRF=0
      - HIVERELAY_WITNESSLOG=0
    command: ["start", "--storage", "/data", "--region", "AS", "--max-storage", "50GB"]

volumes:
  hiverelay-data:
  hiverelay-na-data:
  hiverelay-eu-data:
  hiverelay-as-data:
